apiVersion: apps/v1
kind: Deployment  
metadata:
  name: my-deploy
  labels:
    app: deploy-app
spec:
  replicas: 3 
  template:
    metadata: 
      labels:
        app: deploy-app
    spec:
      containers:
        - name: my-c
          image: httpd
          ports:
            - containerPort: 80