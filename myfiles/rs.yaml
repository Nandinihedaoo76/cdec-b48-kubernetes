apiVersion : apps/v1
kind: ReplicaSet
metadata:
  name: my-rs
  labels:
    app: cbz-app    
spec:
  replicas: 3 
  selector:
    matchLabels:
        app: cbz-app
    matchExpressions:
        - {key: app, operator: In, values: [cbz-app, rs-app]}  
  template:
    metadata: 
      labels:
        app: cbz-app
    spec:
      containers:
        - name: my-c
          image: httpd
          ports:
            - containerPort: 80
  